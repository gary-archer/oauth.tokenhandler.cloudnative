_format_version: '3.0'
_transform: true

services:
- name: oauthuserinfo
  url: https://login.authsamples.com/oauth2/userInfo
  routes:
  - name: oauthuserinfo-route
    hosts:
    - bfflocal.authsamples-dev.com
    paths:
    - /oauthuserinfo
  plugins:
  - name: cors
    config:
      origins:
      - https://www.authsamples-dev.com
      credentials: true
      max_age: 86400
  - name: oauth-proxy
    config:
      encryption_key: "${COOKIE_ENCRYPTION_KEY}"
      cookie_name_prefix: authsamples
